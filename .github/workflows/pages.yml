name: Deploy configurator (GitHub Pages)

on:
  push:
    branches: [trunk]
    paths:
      - 'website/**'
      - 'software/res/build_manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v6

    - name: Assemble site
      run: |
        mkdir _site
        cp website/* _site/
        cp software/res/build_manifest.json _site/

    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v4
      with:
        path: _site

    - id: deployment
      uses: actions/deploy-pages@v4
