name: PlatformIO CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'software/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'software/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [T32dev, T40, T41]

    steps:
    - uses: actions/checkout@v6

    - name: Setup env
      run: |
        echo "OC_ARTIFACT_TAG=${GITHUB_REF_NAME}-${{ matrix.env }}-$(git rev-parse --short HEAD)" | tr '/' '_' >> $GITHUB_ENV

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        cache: 'pip'
        cache-dependency-path: '**/requirements.txt'

    - run: |
        pip3 install --upgrade pip
        pip3 install -r .github/workflows/requirements.txt

    - name: Build firmware
      working-directory: software/
      run: |
        pio run -e ${{ matrix.env }} | tee build.log

    - name: Report size
      working-directory: software/
      run: |
        echo "### ${{ matrix.env }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        grep -E "^(RAM|Flash):" build.log >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Copy artifact
      uses: actions/upload-artifact@v7
      with:
        name: o_C-${{env.OC_ARTIFACT_TAG}}
        include-hidden-files: true
        path: |
          software/*.hex
          software/*.ehex
          software/.pio/build/*/*.hex
          software/.pio/build/*/*.ehex

  host-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Run unit tests
      working-directory: software/test/
      run: make

  applet-guards:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Check applet registry guards
      working-directory: software/
      run: python3 tools/gen_applet_guards.py --check

    - name: Check build manifest consistency
      working-directory: software/
      run: python3 res/check_manifest.py
